name: Build NAMDroid APK

# Se ejecuta automaticamente al hacer push, y tambien se puede lanzar a mano
# desde la pestaña "Actions" del repo con el boton "Run workflow".
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK y CMake
        uses: android-actions/setup-android@v3

      - name: Instalar NDK y CMake exactos
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Descargar Eigen (dependencia header-only de NAM)
        run: bash scripts/setup_dependencies.sh

      - name: Generar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Dar permisos de ejecucion a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de debug (instalable directo)
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: NAMDroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
